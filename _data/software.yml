- group: Molecular Dynamics
  items:
    - name: AMBER
      url: https://ambermd.org/
      description: A suite of biomolecular simulation programs is distributed in two parts, AmberTools and Amber. AmberTools is a set of programs for biomolecular simulation and analysis.
    - name: CHARMM
      url: https://academiccharmm.org/
      description: A molecular simulation program with broad application to many-particle systems.
    - name: GROMACS
      url: https://www.gromacs.org/
      description: A free and open-source software suite for high-performance molecular dynamics and output analysis.
    - name: NAMD
      url: http://www.ks.uiuc.edu/Research/namd/
      description: A parallel molecular dynamics code designed for high-performance simulation of large biomolecular systems.
    - name: OpenMM
      url: https://openmm.org/
      description: A high-performance toolkit for molecular simulation, including extensive language bindings for Python, C, C++, and even Fortran.
